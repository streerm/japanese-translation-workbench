[project]
name = "japanese-translation-workbench"
version = "0.1.0"
description = "A Japanese-to-English literary translation workbench: multi-model MT with a segment-key failsafe, synthesis, and a Streamlit editing grid."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Streer" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Japanese",
    "Natural Language :: English",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.7",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "pyperclip>=1.9",
    "streamlit>=1.38",
    "typer>=0.12",
]

[project.scripts]
jtw = "jtw.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jtw"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "jtw/prompts"
"projects/_template/project.toml" = "jtw/resources/project.toml"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docx.*", "pyperclip"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=jtw --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["jtw"]
branch = true

[tool.coverage.report]
omit = ["*/jtw/ui/*"]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
